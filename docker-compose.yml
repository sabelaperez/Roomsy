services:
  mariadb:
    image: mariadb:lts-ubi
    container_name: mariadb-roomsy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: roomsydb
      MYSQL_USER: roomsy_user
      MYSQL_PASSWORD: "1234"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - mariadb_network

  redis:
    image: redis:8
    container_name: redis-roomsy
    command: ["redis-server", "--requirepass", "1234"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mariadb_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mariadb_network:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
