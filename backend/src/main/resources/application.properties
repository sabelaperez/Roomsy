spring.application.name=backend

server.servlet.context-path=/api/v1

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

spring.datasource.url=jdbc:mariadb://localhost:3306/roomsydb?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=roomsy_user
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=1234
spring.data.redis.timeout=2000

# JWT Configuration
jwt.secret=your-very-long-secret-key-at-least-256-bits-change-this-in-production
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Cookie Configuration
cookie.access-token-name=access_token
cookie.refresh-token-name=refresh_token
cookie.domain=localhost
cookie.path=/
cookie.secure=false
cookie.http-only=true
cookie.same-site=Lax